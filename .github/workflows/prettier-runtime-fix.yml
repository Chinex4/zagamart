name: Runtime Fix Prettier
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  format:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Apply Prettier to runtime fix
        run: npx prettier "src/app/(student)/layout.tsx" "src/app/admin/(protected)/layout.tsx" "src/components/dashboard/dashboard-shell.tsx" --write
      - name: Commit formatting
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "src/app/(student)/layout.tsx" "src/app/admin/(protected)/layout.tsx" "src/components/dashboard/dashboard-shell.tsx"
          git commit -m "style: format dashboard boundary fix"
          git push

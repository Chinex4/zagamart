name: Storefront Prettier Fix
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  format:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Apply Prettier
        run: npx prettier src/app/page.tsx src/features/auth/components/auth-shell.tsx src/features/auth/components/password-field.tsx src/features/auth/components/register-form.tsx --write
      - name: Commit formatting
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/page.tsx src/features/auth/components/auth-shell.tsx src/features/auth/components/password-field.tsx src/features/auth/components/register-form.tsx
          git commit -m "style: apply storefront Prettier output"
          git push
